name: Question
description: Ask about usage, configuration, or how something works
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        Please check the README and docs/ first — many questions are answered there.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
      description: Context helps us give a better answer than just the literal question.
