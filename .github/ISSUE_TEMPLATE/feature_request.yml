name: Feature request
description: Propose a new capability or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check docs/09-extension-points.md and the open issues/milestones first — it might already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation — what's painful or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see, and any acceptance criteria you'd expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
